<!DOCTYPE html>
<html lang="en">
<head>
    <title>🎮 Gomoku - Five in a Row</title>
    <link rel="icon" src="icon.jpg">
    <link rel="stylesheet" type="text/css" href="mystyle.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Gomoku - Five in a Row</h1>
        
        <div class="info-panel">
            <div class="current-player">
                Current Player: 
                <span id="playerTurn">White</span>
                <span class="whichPayer" id="player"></span>
            </div>
        </div>

        <div id="board"></div>

        <div class="win-message" id="winMessage"></div>

        <div class="controls">
            <button onclick="resetGame()">New Game</button>
            <button onclick="undoMove()">Undo Move</button>
        </div>
    </div>

    <div class="rules">
        <h3>How to Play:</h3>
        <ul>
            <li>Players take turns placing stones on the board intersections</li>
            <li>White plays first</li>
            <li>Get exactly 5 stones in a row (horizontal, vertical, or diagonal) to win</li>
            <li>The game is a draw if the board fills up with no winner</li>
        </ul>
    </div>
    <script src="myjs.js"></script>
</body>
</html>
